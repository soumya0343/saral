# Saral evaluation scenarios (Phase 4).
# Categories: information, action, compliance, adversarial, small_talk.
# Multilingual triples share an `xling_group` for cross-lingual consistency scoring.
# A few carry a `human_label` (expected pass) to validate the judge.

# ---------------- Information (multilingual triples) ----------------
- id: info_cover_en
  category: information
  language: en
  user_id: U1001
  message: "What does my health policy cover?"
  xling_group: g_cover
  human_label: true
  expected: { route: rag, status: resolved }

