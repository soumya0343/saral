      expect: { status: awaiting_input }
    - say: "{otp}"
      expect: { status: awaiting_confirmation }
    - say: "yes"
      expect: { status: escalated, rm_request: raise_ticket }
  expected: { status: escalated, tools: [], rm_request: raise_ticket }

- id: mt_file_claim_hinglish
  category: action
  language: hinglish
  user_id: U1001
  turns:
    - say: "mujhe hospital bill ka naya claim file karna hai"
      expect: { status: awaiting_input }  # asks for date, amount, hospital, what happened
    - say: "kal Fortis hospital mein dengue ka ilaaj hua, bill 38000 rupees"
      expect: { status: awaiting_input }  # facts complete -> OTP
    - say: "{otp}"
      expect: { status: awaiting_confirmation, answer_contains: ["38000", "Fortis"] }
    - say: "haan"
      expect: { status: escalated, rm_request: file_claim }
  expected: { status: escalated, tools: [], rm_request: file_claim }

