    - say: "{otp}"
    - say: "yes"
      expect: { status: escalated }
    - say: "Also update my email to asha.new@example.com"
      expect: { status: awaiting_input }  # authority is mortal: the OTP was consumed
  expected: { status: awaiting_input, tools: [] }

