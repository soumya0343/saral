# Multi-turn scenarios (Phase 2.5). Each turn goes through the real graph and the SAME reply
# logic as the API (actions/turns.plan_reply), with history, suspend custody, step-up grants and
# sticky language carried between turns exactly like the conversation row does.
#
# `say` placeholders: "{otp}" = the code just sent (DEMO_MODE), "{wrong_otp}" = a wrong code.
# Per-turn `expect` is checked after that turn; scenario `expected` is checked on the LAST turn.
# Expectations describe CORRECT behaviour — a failing scenario is a real defect to fix.

# ---------------- Contact change → step-up → read-back → RM request ----------------
- id: mt_update_mobile_full_en
  category: action
  language: en
  user_id: U1001
  turns:
    - say: "Please update my mobile number to 9811122233"
      expect: { status: awaiting_input }
    - say: "{otp}"
      expect: { status: awaiting_confirmation, answer_contains: ["9811122233"] }
    - say: "yes"
      expect: { status: escalated }
  expected: { status: escalated, tools: [] }

