- id: rm_claim_intake_topic_switch_en
  category: action
  language: en
  user_id: U1001
  turns:
    - say: "I want to file a claim"
      expect: { status: awaiting_input }
    - say: "Actually, what is the waiting period for pre-existing diseases?"
      expect: { status: resolved, route: rag }
  expected: { status: resolved, route: rag }

# ---------------- Complaints: empathy, then a human on repeat ----------------
- id: complaint_repeat_en
  category: action
  language: en
  user_id: U1001
  turns:
    - say: "Your app is the worst, nothing is working"
      expect: { status: resolved }  # empathy + offer a ticket
    - say: "Still not working, this is horrible"
      expect: { status: escalated, rm_request: handoff }
  expected: { status: escalated, tools: [], rm_request: handoff }

- id: complaint_repeat_hi
  category: action
  language: hi
  user_id: U1003
  turns:
    - say: "आपकी सेवा बहुत खराब है, कुछ भी काम नहीं कर रहा"
      expect: { status: resolved }
    - say: "अब भी कुछ काम नहीं कर रहा, बेकार"
      expect: { status: escalated, rm_request: handoff }
  expected: { status: escalated, tools: [], rm_request: handoff }

- id: complaint_repeat_hinglish
  category: action
  language: hinglish
  user_id: U1010
  turns:
    - say: "aapka app bekar hai, kuch bhi not working"
      expect: { status: resolved }
    - say: "abhi bhi not working, worst service"
      expect: { status: escalated, rm_request: handoff }
  expected: { status: escalated, tools: [], rm_request: handoff }

# ---------------- Every escalation is an RM request ----------------
- id: rm_handoff_on_burned_otp_en
  category: action
  language: en
  user_id: U1001
  turns:
    - say: "Please update my mobile number to 9811122233"
      expect: { status: awaiting_input }
    - say: "{wrong_otp}"
      expect: { status: awaiting_input }
    - say: "{wrong_otp}"
      expect: { status: awaiting_input }
    - say: "{wrong_otp}"
      expect: { status: awaiting_input }
    - say: "{wrong_otp}"
      expect: { status: awaiting_input }
    - say: "{wrong_otp}"  # OTP_MAX_ATTEMPTS=5: the code is burned -> human
      expect: { status: escalated, rm_request: handoff }
  expected: { status: escalated, tools: [], rm_request: handoff }
