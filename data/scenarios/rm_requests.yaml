# ---------------- Claim intake: structured facts, not the chat message ----------------
- id: rm_claim_intake_stepwise_en
  category: action
  language: en
  user_id: U1001
  turns:
    - say: "I want to file a claim"
      expect: { status: awaiting_input }  # asks date, amount, hospital, what happened
    - say: "It was a knee surgery at Apollo Hospital yesterday"
      expect: { status: awaiting_input }  # amount still missing
    - say: "45000"
      expect: { status: awaiting_input }  # complete -> OTP
    - say: "{otp}"
      expect: { status: awaiting_confirmation, answer_contains: ["45000", "Apollo Hospital", "knee surgery"] }
    - say: "yes"
      expect: { status: escalated, rm_request: file_claim }
  expected: { status: escalated, tools: [], rm_request: file_claim }

- id: rm_claim_intake_hi
  category: action
  language: hi
  user_id: U1003
  turns:
    - say: "मुझे नया क्लेम दर्ज करना है"
      expect: { status: awaiting_input }
    - say: "कल सिटी अस्पताल में पैर की हड्डी टूटने का इलाज हुआ, खर्च 30000 रुपये"
      expect: { status: awaiting_input }
    - say: "{otp}"
      expect: { status: awaiting_confirmation, answer_contains: ["30000", "सिटी अस्पताल"] }
    - say: "हाँ"
      expect: { status: escalated, rm_request: file_claim }
  expected: { status: escalated, tools: [], rm_request: file_claim }

- id: rm_claim_intake_which_policy_en
  category: action
  language: en
  user_id: U1002  # holds two policies: the agent must ask which one
  turns:
    - say: "File a claim: car accident yesterday, repaired at Sharma Motors for Rs 18,500"
      expect: { status: awaiting_input, answer_contains: ["POL1002", "POL1012"] }
    - say: "POL1002"
      expect: { status: awaiting_input }
    - say: "{otp}"
      expect: { status: awaiting_confirmation, answer_contains: ["POL1002", "18500"] }
    - say: "yes"
      expect: { status: escalated, rm_request: file_claim }
  expected: { status: escalated, tools: [], rm_request: file_claim }

- id: rm_claim_intake_cancel_hinglish
