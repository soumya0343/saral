# Phase 4 — RM requests, claim intake, complaints.
# Every write and every escalation becomes a request for the customer's relationship manager
# (RM). These check it is complete, deduplicated, queryable by the customer in their language,
# and that a claim carries structured facts, not the raw chat message.

# ---------------- Dedup: asking twice gives one request ----------------
- id: rm_duplicate_contact_change_en
  category: action
  language: en
  user_id: U1001
  turns:
    - say: "Please update my mobile number to 9811122233"
      expect: { status: awaiting_input }
    - say: "{otp}"
      expect: { status: awaiting_confirmation }
    - say: "yes"
      expect: { status: escalated, rm_request: update_contact }
    - say: "Please update my mobile number to 9811122233"
      expect: { status: resolved, rm_request: update_contact, rm_duplicate: true }  # no 2nd OTP
  expected: { status: resolved, tools: [], rm_request: update_contact, rm_duplicate: true }

- id: rm_duplicate_contact_change_hinglish
  category: action
  language: hinglish
  user_id: U1010
  turns:
    - say: "mera mobile number badal do 9811122233"
      expect: { status: awaiting_input }
    - say: "{otp}"
      expect: { status: awaiting_confirmation }
    - say: "haan"
      expect: { status: escalated, rm_request: update_contact }
    - say: "mera mobile number 9811122233 par badal do please"
      expect: { status: resolved, rm_duplicate: true, rm_request: update_contact }
  expected: { status: resolved, tools: [], rm_request: update_contact, rm_duplicate: true }

- id: rm_different_change_is_a_new_request_en
  category: action
  language: en
  user_id: U1001
  turns:
    - say: "Please update my mobile number to 9811122233"
      expect: { status: awaiting_input }
    - say: "{otp}"
      expect: { status: awaiting_confirmation }
    - say: "yes"
      expect: { status: escalated, rm_request: update_contact }
    - say: "Please update my email to asha.new@example.com"
      expect: { status: awaiting_input }  # a different change: its own OTP, its own request
  expected: { status: awaiting_input }

# ---------------- The customer asks what happened to it ----------------
- id: rm_status_after_change_hi
  category: action
  language: hi
  user_id: U1003
  turns:
    - say: "मेरा मोबाइल नंबर 9811122233 में बदल दो"
      expect: { status: awaiting_input }
    - say: "{otp}"
      expect: { status: awaiting_confirmation }
    - say: "हाँ"
      expect: { status: escalated, rm_request: update_contact }
    - say: "मेरे अनुरोध की स्थिति क्या है?"
      expect: { status: resolved, tools: [get_request_status], answer_contains: ["REQ"] }
  expected: { status: resolved, tools: [get_request_status] }

