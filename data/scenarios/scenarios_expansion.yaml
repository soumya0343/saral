# Saral evaluation scenarios — EXPANSION SET (v2). ~70 scenarios merged with the base 28
# (total ~98) by load_scenarios() globbing this directory. Top-level YAML list, inline
# flow-style `expected`. Covers explanation-groundedness (the differentiator), impersonation,
# multilingual triples, write+step-up, injection, small talk, and generic-corpus info.

