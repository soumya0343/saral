    policies:
      - {policy_id: POL1003, product: term_life, status: lapsed, premium_inr: 22000, sum_assured_inr: 5000000, renewal_date: "2026-02-01"}
    claims:
      - {claim_id: CLM2030, policy_id: POL1003, status: rejected, amount_inr: 0, last_updated: "2026-05-12", clause_ref: "6.2", note: "Claim rejected — policy lapsed for non-payment beyond the grace period (Clause 6.2)."}
    billing:
      - {due_date: "2025-11-01", amount_inr: 22000, paid: false}
    documents:
      - {path: data/customers/U1003/policy_schedule.md, domain: policy_coverage, title: "मीना कुमारी — सुरक्षा टर्म लाइफ पॉलिसी अनुसूची", language: hi}
      - {path: data/customers/U1003/claims/CLM2030.md, domain: claims, title: "क्लेम CLM2030 निर्णय टिप्पणी", language: hi}
      - {path: data/customers/U1003/correspondence.md, domain: interaction_history, title: "मीना कुमारी — संपर्क इतिहास", language: hi}

