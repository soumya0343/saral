# Per-customer dataset manifest (TRD §12.3, FR-16) — the differentiator.
#
# Hero customers carry full document-fidelity records (policy schedules with numbered clauses,
# rider variants, claim adjudication notes citing those clauses) across the five data domains.
# Thin customers are structured rows only (statistical N + leak tests). The structured rows
# here are internally consistent with each hero's authored documents (same clause refs, amounts,
# statuses) — that consistency is the whole point. All rows carry tenant_id (single tenant today).
#
# The mock core-system store seeds users/policies/claims from this file (additive, skip-if-exists);
# the per-customer RAG index loads each hero's `documents` and hard-filters by customer_id ∧ domain.

customers:
  # ── HERO 1 — English, health, partial-claim explanation-groundedness (Clause 4.1/4.2) ──
  - customer_id: U1001
    tenant_id: t_demo
    is_hero: true
    name: Asha Verma
    dob: "1988-04-12"
    registered_mobile: "9876500001"
    registered_email: asha@example.com
    policies:
      - {policy_id: POL1001, product: health, status: active, premium_inr: 14500, sum_assured_inr: 500000, renewal_date: "2026-11-01"}
    claims:
      - {claim_id: CLM2010, policy_id: POL1001, status: partially_approved, amount_inr: 32400, last_updated: "2026-05-20", clause_ref: "4.1, 4.2", note: "Partial settlement; proportionate deduction under Clause 4.1 + 10% co-pay under Clause 4.2."}
    billing:
      - {due_date: "2025-11-01", amount_inr: 14500, paid: true}
      - {due_date: "2026-11-01", amount_inr: 14500, paid: false}
    documents:
      - {path: data/customers/U1001/policy_schedule.md, domain: policy_coverage, title: "Asha Verma — Arogya Secure Health Policy Schedule", language: en}
      - {path: data/customers/U1001/claims/CLM2010.md, domain: claims, title: "Claim CLM2010 adjudication note", language: en}
      - {path: data/customers/U1001/correspondence.md, domain: interaction_history, title: "Asha Verma — support history", language: en}

  # ── HERO 2 — Hindi, term life, claim REJECTED because policy lapsed (Clause 6.2 grace) ──
  - customer_id: U1003
    tenant_id: t_demo
    is_hero: true
    name: Meena Kumari
    dob: "1979-09-30"
    registered_mobile: "9876500003"
